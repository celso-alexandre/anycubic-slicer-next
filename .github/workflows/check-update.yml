name: Check for new Anycubic release

# Weekly: if Anycubic's APT repo has a newer .deb, (re)write the single auto/update-deb
# branch and upsert one PR for it. Build runs are dispatched explicitly because pushes
# made with GITHUB_TOKEN do not trigger other workflows.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: auto/update-deb
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          set +e; V=$(ci/check-update.sh); rc=$?; set -e
          [ "$rc" = 3 ] && exit 0
          [ "$rc" = 0 ] || exit "$rc"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Upsert PR
        if: steps.check.outputs.version
        env:
          V: ${{ steps.check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin "$BRANCH" 2>/dev/null && git diff --quiet FETCH_HEAD -- flatpak/; then
            echo "$BRANCH already proposes $V"; exit 0
          fi
          git checkout -B "$BRANCH"
          git commit -qam "Update to Anycubic Slicer Next $V"
          git push -f origin "$BRANCH"

          TITLE="Update to Anycubic Slicer Next $V"
          BODY="Anycubic's APT repo has a new .deb: \`$(grep -oP 'url: \K\S+\.deb' flatpak/com.anycubic.AnycubicSlicer.yml)\`

          The Build workflow runs on this branch and smoke-tests both the Flatpak and the AppImage. Merging publishes the release and updates the flatpak repo."
          N=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -n "$N" ]; then gh pr edit "$N" --title "$TITLE" --body "$BODY"
          else gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"; fi
          gh workflow run build.yml --ref "$BRANCH"
